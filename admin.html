<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Admin | FOX PRINT 3D</title><link rel="icon" type="image/png" href="marca/logo-foxprint3d.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-browser-fixes.css">
</head>
<body class="admin-page">
  <header class="admin-header"><a class="brand" href="index.html"><img class="brand-logo" src="marca/logo-foxprint3d.png" alt=""><span class="brand-name"><span class="brand-mark">FOX</span> PRINT 3D</span></a><a href="index.html" class="admin-back">Ver loja ↗</a></header>
  <main class="admin-shell">
    <section class="admin-login" id="loginView">
      <span class="eyebrow">ÁREA RESTRITA</span><h1>Administração</h1><p>Entre com o usuário criado no Supabase.</p>
      <form id="loginForm"><label>E-mail<input id="loginEmail" type="email" required></label><label>Senha<input id="loginPassword" type="password" required></label><button class="btn" type="submit">Entrar</button><p class="form-status" id="loginStatus"></p></form>
    </section>
    <section id="adminView" hidden>
      <div class="admin-top"><nav class="admin-tabs" aria-label="Seções administrativas"><button class="admin-tab active" data-view="productsView">Produtos</button><button class="admin-tab" data-view="salesView">Vendas</button><button class="admin-tab" data-view="productionView">Fila de impressão</button></nav><button class="btn btn-outline" id="logoutButton">Sair</button></div>
      <section class="admin-view" id="productsView"><div class="admin-title"><div><span class="eyebrow">CATÁLOGO</span><h1>Produtos</h1></div><button class="btn" id="newProductButton">Novo produto</button></div><div class="admin-products" id="adminProducts"></div></section>
      <section class="admin-view" id="salesView" hidden><div class="admin-title"><div><span class="eyebrow">FINANCEIRO</span><h1>Vendas e pagamentos</h1></div><button class="btn" id="newSaleButton">Nova venda</button></div><div class="summary-grid" id="salesSummary"></div><div class="sales-table-wrap"><table class="sales-table"><thead><tr><th>Cliente / pedido</th><th>Valor</th><th>Pagamento</th><th>Entrega</th><th></th></tr></thead><tbody id="salesList"></tbody></table></div></section>
      <section class="admin-view" id="productionView" hidden><div class="admin-title"><div><span class="eyebrow">PRODUÇÃO</span><h1>Fila de impressão</h1><p>Arraste cada cartão entre as etapas.</p></div><button class="btn" id="newJobButton">Novo cartão</button></div><div class="kanban" id="kanbanBoard"></div></section>
    </section>
  </main>
  <dialog class="product-editor" id="productEditor">
    <form id="productForm"><div class="editor-head"><h2 id="editorTitle">Novo produto</h2><button type="button" class="editor-close" aria-label="Fechar">×</button></div>
      <input id="productId" type="hidden">
      <div class="form-grid"><label class="wide">Nome<input id="productName" required></label><label>Preço em R$<input id="productPrice" type="number" min="0" step="0.01" placeholder="Vazio = sob consulta"></label><label>Categoria<select id="productCategory"><option value="presentes">Presentes</option><option value="decoracao">Decoração</option><option value="utilidades">Utilidades</option></select></label><label>Etiqueta<input id="productTag" placeholder="Ex.: Personalizável"></label><label>Ordem<input id="productPosition" type="number" min="0" value="0"></label><label class="wide">Descrição<textarea id="productDescription" rows="3" required></textarea></label><label class="wide">Fotos<input id="productImages" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>JPG, PNG ou WebP. Você pode selecionar várias.</small></label><label class="check"><input id="productActive" type="checkbox" checked> Produto visível na loja</label></div>
      <div class="existing-images" id="existingImages"></div><p class="form-status" id="productStatus"></p><button class="btn btn-full" type="submit">Salvar produto</button>
    </form>
  </dialog>
  <dialog class="product-editor" id="saleEditor"><form id="saleForm"><div class="editor-head"><h2 id="saleEditorTitle">Nova venda</h2><button type="button" class="editor-close sale-close" aria-label="Fechar">×</button></div><input id="saleId" type="hidden"><div class="form-grid"><label>Cliente<input id="saleCustomer" required></label><label>Contato<input id="saleContact"></label><label class="wide">Descrição do pedido<input id="saleDescription" required></label><label>Valor total<input id="saleTotal" type="number" min="0" step="0.01" required></label><label>Valor pago<input id="salePaid" type="number" min="0" step="0.01" value="0"></label><label>Forma de pagamento<select id="saleMethod"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></label><label>Status<select id="saleStatus"><option value="pendente">Pendente</option><option value="parcial">Parcial</option><option value="pago">Pago</option><option value="cancelado">Cancelado</option></select></label><label>Data da venda<input id="saleDate" type="date" required></label><label>Previsão de entrega<input id="saleDueDate" type="date"></label><label class="wide">Observações<textarea id="saleNotes" rows="3"></textarea></label></div><p class="form-status" id="saleStatusText"></p><div class="editor-actions"><button class="btn btn-outline delete-sale" type="button" hidden>Excluir</button><button class="btn" type="submit">Salvar venda</button></div></form></dialog>
  <dialog class="product-editor" id="jobEditor"><form id="jobForm"><div class="editor-head"><h2 id="jobEditorTitle">Novo cartão</h2><button type="button" class="editor-close job-close" aria-label="Fechar">×</button></div><input id="jobId" type="hidden"><div class="form-grid"><label class="wide">Título<input id="jobTitle" required></label><label>Etapa<select id="jobStage"><option value="ideias">Ideias</option><option value="preparar">Preparar arquivo</option><option value="pronto">Pronto para imprimir</option><option value="imprimindo">Em impressão</option><option value="acabamento">Acabamento</option><option value="finalizado">Finalizado</option></select></label><label>Prioridade<select id="jobPriority"><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></label><label>Tempo estimado (min)<input id="jobMinutes" type="number" min="0"></label><label>Prazo<input id="jobDueDate" type="date"></label><label class="wide">Detalhes<textarea id="jobNotes" rows="3"></textarea></label></div><p class="form-status" id="jobStatusText"></p><div class="editor-actions"><button class="btn btn-outline delete-job" type="button" hidden>Excluir</button><button class="btn" type="submit">Salvar cartão</button></div></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script><script src="admin-operations.js"></script>
</body></html>
